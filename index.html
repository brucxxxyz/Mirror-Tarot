<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>镜面塔罗 · Mirror Tarot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<button class="theme" id="themeBtn" aria-label="切换明暗">☀</button>

<div class="app">
  <h1>MIRROR TAROT</h1>
  <div class="sub">镜面塔罗 · 照见自己</div>

  <div class="tabs">
    <button class="on" data-tab="daily">日卡</button>
    <button data-tab="ask">一问</button>
    <button data-tab="hist">记录</button>
  </div>

  <!-- ============================================================
       日卡
       ============================================================ -->
  <section class="view on" id="v-daily">
    <button class="act" id="dailyBtn">抽一张</button>
    <div id="dailyOut"></div>
  </section>

  <!-- ============================================================
       一问 · 过去 / 现在 / 未来
       - #askStage   三张牌位（由 app.js 动态渲染）
       - #askReading L2 分析结果（三张全翻开后填充）
       ============================================================ -->
  <section class="view" id="v-ask">
    <div class="hint-line" id="askHint">Step 1 · 写下你的问题</div>
    <textarea id="qInput" placeholder="最近在想什么？写下你的问题..."></textarea>

    <button class="act" id="askBtn">洗牌 · 抽 3 张牌</button>

    <!-- 三张牌位：过去 / 现在 / 未来 -->
    <div class="stage" id="askStage"></div>

    <!-- L2 分析结果 -->
    <div class="reading" id="askReading"></div>
  </section>

  <!-- ============================================================
       记录
       ============================================================ -->
  <section class="view" id="v-hist">
    <div id="histOut"></div>
  </section>
</div>

<footer class="tip">— Designed by <span class="by">BY</span> —</footer>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
